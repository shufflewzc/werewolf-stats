# Include this file inside the wolf.metauniverse-cn.xyz TLS server block.
# It deliberately covers public, read-only tournament data only.
location ~ ^/api/(dashboard|competitions|guilds|players|teams|predictions|days/) {
    proxy_pass http://127.0.0.1:8000;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    limit_req zone=werewolf_public_read burst=40 nodelay;

    proxy_cache werewolf_public_api;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 60s;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    add_header X-Cache-Status $upstream_cache_status always;
}

# Include inside the wolf.metauniverse-cn.xyz TLS server block before the catch-all location.
# Universal Links association endpoints must be public and must not redirect.
location = /.well-known/apple-app-site-association {
    alias /etc/nginx/snippets/apple-app-site-association;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /apple-app-site-association {
    alias /etc/nginx/snippets/apple-app-site-association;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Only anonymous GET/HEAD responses are cached; authenticated sessions always bypass it.
location ~ ^/(?:$|privacy/?$|dashboard$|competitions(?:/.*)?$|series(?:/.*)?$|days(?:/.*)?$|matches/[^/]+$|players/[^/]+$|teams/[^/]+$|guilds(?:/[^/]+)?$) {
    if ($werewolf_blocked_crawler) {
        return 403;
    }

    proxy_pass http://127.0.0.1:8000;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    limit_req zone=werewolf_public_read burst=10 nodelay;
    limit_conn werewolf_public_conn 4;
    proxy_cache werewolf_public_html;
    proxy_cache_methods GET HEAD;
    proxy_cache_bypass $werewolf_skip_public_cache;
    proxy_no_cache $werewolf_skip_public_cache $upstream_http_set_cookie;
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_valid 200 30s;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-HTML-Cache-Status $upstream_cache_status always;
}

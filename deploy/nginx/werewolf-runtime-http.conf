# Include from the nginx `http` block.
proxy_cache_path /var/cache/nginx/werewolf-public-html
  levels=1:2
  keys_zone=werewolf_public_html:20m
  inactive=10m
  max_size=200m
  use_temp_path=off;

limit_req_zone $binary_remote_addr zone=werewolf_public_read:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=werewolf_sensitive_api:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=werewolf_public_conn:10m;
limit_req_status 429;
limit_conn_status 429;

map $http_user_agent $werewolf_blocked_crawler {
    default 0;
    ~*(MJ12bot|SemrushBot) 1;
}

map $http_cookie $werewolf_skip_public_cache {
    default 0;
    ~*werewolf_session 1;
}

name: WerewolfStats
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7DSUH6B44P
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  WerewolfStats:
    type: application
    platform: iOS
    sources:
      - path: WerewolfStats
        excludes:
          - Resources
      - path: WerewolfStats/Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - WerewolfStats.entitlements
    info:
      path: WerewolfStats/Resources/Info.plist
      properties:
        CFBundleDisplayName: "一颗小草赛事"
        NSPhotoLibraryAddUsageDescription: "仅在你主动保存战绩卡时，将图片添加到照片图库。"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: WerewolfStats/Resources/WerewolfStats.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:wolf.metauniverse-cn.xyz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.metauniverse.werewolfstats
        PRODUCT_NAME: WerewolfStats
        PRODUCT_MODULE_NAME: WerewolfStats
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          VALIDATE_PRODUCT: YES
  WerewolfStatsTests:
    type: bundle.unit-test
    platform: iOS
    sources: WerewolfStatsTests
    dependencies:
      - target: WerewolfStats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.metauniverse.werewolfstats.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  WerewolfStatsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: WerewolfStatsUITests
    dependencies:
      - target: WerewolfStats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.metauniverse.werewolfstats.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WerewolfStats:
    build:
      targets:
        WerewolfStats: all
        WerewolfStatsTests: [test]
        WerewolfStatsUITests: [test]
    test:
      targets:
        - WerewolfStatsTests
        - WerewolfStatsUITests
      gatherCoverageData: true
